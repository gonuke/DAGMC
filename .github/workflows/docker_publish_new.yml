name: Build & Publish docker image for DAGMC-CI

on:
  # allows us to run workflows manually
  workflow_dispatch:
  push:
    paths:
      - 'CI/?ocker**'
      - '.github/workflows/docker_publish_new.yml'


jobs:
  build-base-img:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_versions : [
          20.04,
          ]
    name: Ubuntu ${{ matrix.ubuntu_versions }} basics deps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache-${{ github.sha }}
          # Key is named differently to avoid collision
          key: ${{ runner.os }}-multi-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-multi-buildx

      - name: "Build, push, and cache target: base"
        uses: docker/build-push-action@v2
        with:
          file: CI/Dockerfile
          target: base
          push: true
          context: .
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_versions }}
          tags: ghcr.io/${{ github.repository_owner }}/dagmc-ci-ubuntu-${{ matrix.ubuntu_versions }}:ci_testing
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-${{ github.sha }}


  build-housekeeping-img:
    needs: build-base-img
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_versions : [
          20.04,
          ]

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache-${{ github.sha }}
          # Key is named differently to avoid collision
          key: ${{ runner.os }}-multi-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-multi-buildx

      - name: "Build, push, and cache target: housekeeping"
        uses: docker/build-push-action@v2
        with:
          file: CI/Dockerfile
          target: housekeeping
          context: .
          push: true
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_versions }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/dagmc-ci-ubuntu-${{ matrix.ubuntu_versions }}-housekeeping:ci_testing


    build-deps-img:
    needs: build-base-img
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_versions : [
          20.04,
          ]
        compiler : [
          gcc,
          clang,
          ]

    name: Ubuntu ${{ matrix.ubuntu_versions }} + ${{ matrix.compiler }}
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache-${{ github.sha }}
          # Key is named differently to avoid collision
          key: ${{ runner.os }}-multi-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-multi-buildx

      - name: "Build, push, and cache target: external_deps"
        uses: docker/build-push-action@v2
        with:
          file: CI/Dockerfile
          target: external_deps
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: false
          build-args: |
            OWNER=${{ github.repository_owner }}
            TAG=ci_testing
            UBUNTU_VERSION=${{ matrix.ubuntu_versions }}
            COMPILER=${{ matrix.compiler }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/dagmc-ci-ubuntu-${{ matrix.ubuntu_versions }}-${{ matrix.compiler}}-ext:ci_testing

name: Build & Publish docker image for DAGMC-CI

on:
  # allows us to run workflows manually
  workflow_dispatch:
  push:
    paths:
      - 'CI/?ocker**'
      - '.github/workflows/docker_publish_new.yml'


jobs:
  ##############################
  #
  # build-base-img
  #
  # Start with a standard ubuntu image and add necessary standard dependencies
  # using apt-get and pip
  #
  # Build Dockerfile target: base
  #
  # inputs:
  #   None
  #
  # outputs:
  #   pushed image: ghcr.io/{github.repository_owner}/dagmc-ci-ubuntu-{ubuntu_versions}:ci_testing
  #   cached environment: /tmp/.buildx-cache-${{ github.sha }}
  #
  ############################

  build-base-img:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_versions : [
          20.04,
          ]
    name: Ubuntu ${{ matrix.ubuntu_versions }} basics deps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          key: ${{ runner.os }}-multi-buildx-${{ github.sha }}
          path: /tmp/.buildx-cache-${{ github.sha }}

      - name: "Build, push, and cache target: base"
        uses: docker/build-push-action@v2
        with:
          file: CI/Dockerfile
          target: base
          push: true
          context: .
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_versions }}
          tags: ghcr.io/${{ github.repository_owner }}/dagmc-ci-ubuntu-${{ matrix.ubuntu_versions }}:ci_testing
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-${{ github.sha }}

  ##############################
  #
  # build-housekeeping-img
  #
  # Extend base image by adding Sphinx and clang-format
  #
  # Build Dockerfile target: base => housekeeping
  #
  # inputs:
  #   cached environment: /tmp/.buildx-cache-${{ github.sha }}
  #
  # outputs:
  #   pushed image: ghcr.io/{github.repository_owner}/dagmc-ci-ubuntu-{ubuntu_versions}-housekeeping:ci_testing
  #
  ############################
  build-housekeeping-img:
    needs: build-base-img
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_versions : [
          20.04,
          ]

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true

      - name: "Build, push, and cache target: housekeeping"
        uses: docker/build-push-action@v2
        with:
          file: CI/Dockerfile
          target: housekeeping
          context: .
          push: true
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_versions }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/dagmc-ci-ubuntu-${{ matrix.ubuntu_versions }}-housekeeping:ci_testing

  ##############################
  #
  # build-deps-img
  #
  # Extend base image by installing:
  #   * GEANT4
  #   * Embree
  #
  # Build Dockerfile target: base => external_deps
  #
  # inputs:
  #   cached environment: /tmp/.buildx-cache-${{ github.sha }}
  #
  # outputs:
  #   pushed image: ghcr.io/{github.repository_owner}/dagmc-ci-ubuntu-{ubuntu_versions}-{compiler}-ext:ci_testing
  #   cached environment: /tmp/.buildx-cache-${{ matrix-compiler }}-${{ github.sha }}
  #
  ############################
  build-deps-img:
    needs: build-base-img
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_versions : [
          20.04,
          ]
        compiler : [
          gcc,
          clang,
          ]

    name: Ubuntu ${{ matrix.ubuntu_versions }} + ${{ matrix.compiler }}
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          key: ${{ runner.os }}-multi-buildx-${{ matrix.compiler }}-${{ github.sha }}
          path: /tmp/.buildx-cache-${{ matrix.compiler }}-${{ github.sha }}

      - name: "Build, push, and cache target: external_deps"
        uses: docker/build-push-action@v2
        with:
          file: CI/Dockerfile
          target: external_deps
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: false
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_versions }}
            COMPILER=${{ matrix.compiler }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/dagmc-ci-ubuntu-${{ matrix.ubuntu_versions }}-${{ matrix.compiler}}-ext:ci_testing
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-${{ matrix.compiler }}-${{ github.sha }}

  ##############################
  #
  # build-moab-img
  #
  # Extend external_Deps image by installing:
  #   * MOAB
  #
  # Build Dockerfile target: external_deps => moab
  #
  # inputs:
  #   cached environment: /tmp/.buildx-cache-${{ matrix-compiler }}-${{ github.sha }}
  #
  # outputs:
  #   pushed image: ghcr.io/{github.repository_owner}/dagmc-ci-ubuntu-{ubuntu_versions}-{compiler}-moab_{moab_version}:ci_testing
  #
  ############################
  build-moab-img:
    needs: build-deps-img
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_versions : [
          20.04,
          ]
        compiler : [
          gcc,
          clang,
          ]
        moab_versions : [
          5.4.0,
          develop,
          master,
        ]

    name: Ubuntu ${{ matrix.ubuntu_versions }} + ${{ matrix.compiler }} + Moab ${{ matrix.moab_versions }}

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true

      - name: Build and push Dockerfile_3_moab
        uses: docker/build-push-action@v2
        with:
          file: CI/Dockerfile
          target: moab
          context: .
          push: true
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_versions }}
            COMPILER=${{ matrix.compiler }}
            MOAB=${{ matrix.moab_versions }}
          cache-to: type=local,src=/tmp/.buildx-cache-${{ matrix.compiler }}-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/dagmc-ci-ubuntu-${{ matrix.ubuntu_versions }}-${{ matrix.compiler}}-ext-moab_${{ matrix.moab_versions }}:ci_testing
